name: Build APK

# Manual release, same model as iroh-ssh-android: run it from the Actions tab and
# it cross-compiles the daemon, builds a signed APK, and publishes it as a GitHub
# Release. With no signing secret set it still builds a debug-signed (installable)
# APK, so it works the moment the repo is pushed.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The Grayjay plugin's config version is the git commit count (see
          # filestrd/build.rs). A shallow clone would bake version 1 and Grayjay
          # would never update the plugin — fetch the full history.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # The two ABIs scripts/build-android.sh ships a daemon for.
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"

      - name: Cross-compile filestrd into jniLibs (both ABIs)
        env:
          # Use the NDK preinstalled on the runner image.
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build-android.sh

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Set version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_CODE=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null | grep -oP '\+\K\d+$' || echo "9")
          BUILD_NUMBER=$((PREV_CODE + 1))
          echo "name=$(date -u +'%y.%m.%d.%H.%M')" >> "$GITHUB_OUTPUT"
          echo "code=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: app
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/keystore.jks', runner.temp) || '' }}
        run: flutter build apk --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.code }}

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}
          name: ${{ steps.version.outputs.name }}+${{ steps.version.outputs.code }}
          body: Built from ${{ github.sha }}.
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
