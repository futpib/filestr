[package]
name = "filestrd"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["chat"]
# Optional nostr chat plane (Marmot/MLS hubs). Disable for an iroh-only build.
chat = ["dep:filestr-chat", "dep:nostr"]
# Optional loopback HTTP gateway that serves the Grayjay source plugin and
# streams files to it (and any other localhost app). Off by default; the
# whole hyper stack is pulled in only when enabled.
grayjay = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:async-stream"]

[dependencies]
anyhow = "1.0.102"
async-stream = { version = "0.3.6", optional = true }
clap = { version = "4.6.1", features = ["derive"] }
data-encoding = "2.11.0"
filestr-chat = { path = "../filestr-chat", optional = true }
futures-lite = "2.6.1"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
iroh = "1.0.0-rc.1"
iroh-blobs = "0.102.0"
libc = "0.2.186"
libfilestr = { path = "../libfilestr" }
mp4 = "0.14.0"
n0-error = "1.0.0-rc.0"
nostr = { version = "0.44.3", optional = true, features = ["nip44", "nip59"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
symphonia = { version = "0.6.0", features = ["all"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
toml_edit = "0.25.12"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"

[dev-dependencies]
# e2e harness (scripts/autotests/ ported to cargo test): drive the real daemon
# over its typed control protocol + HTTP gateway, no curl|jq / sleep / die bash.
libfilestrctl = { path = "../libfilestrctl" }
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
